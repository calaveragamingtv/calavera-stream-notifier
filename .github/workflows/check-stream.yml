
name: Check Twitch Stream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install -r src/instagram/requirements.txt

      - name: Install MoviePy dependencies
        run: |
          pip install --no-deps "moviepy==2.2.1"
          pip install decorator imageio imageio_ffmpeg proglog python-dotenv numpy

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run stream checker
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        run: python check_stream.py

      - name: Save stream state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stream_state.json data/post_history.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update stream state"
            git push
          fi
