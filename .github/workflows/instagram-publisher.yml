
name: Instagram Story Publisher

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Streaming platform"
        required: true
        type: choice
        options:
          - twitch
          - kick

jobs:
  publish-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Instagram dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/instagram/requirements.txt

      - name: Install MoviePy
        run: |
          pip install --no-deps "moviepy==2.2.1"
          pip install decorator imageio imageio_ffmpeg proglog python-dotenv numpy

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify dependencies
        run: |
          pip show instagrapi
          pip show moviepy
          pip show pillow
          ffmpeg -version

      - name: Publish Instagram Story
        env:
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        run: |
          python -m src.instagram.publisher \
            --platform "${{ inputs.platform }}"
