
name: Instagram Story Publisher

on:
  workflow_dispatch:
    inputs:
      media_file:
        description: "Path to the image or video inside the repository"
        required: true
        type: string
        default: "assets/instagram/story.jpg"

jobs:
  publish-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/instagram/requirements.txt

      - name: Install MoviePy
        run: |
          pip install --no-deps "moviepy==2.2.1"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify dependencies
        run: |
          pip show instagrapi
          pip show moviepy
          ffmpeg -version

      - name: Publish Instagram Story
        env:
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        run: |
          python -m src.instagram.publisher \
            --file "${{ inputs.media_file }}"
