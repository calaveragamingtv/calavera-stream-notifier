
name: Instagram - Test Credentials

on:
  workflow_dispatch:

jobs:
  test-credentials:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Instagram dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/instagram/requirements.txt

      - name: Test Instagram credentials
        env:
          IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
        run: |
          python -m src.instagram.test_credentials
